# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  ds_customer_process_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"

models:
  my_new_project:

    example:
      +materialized: table

    Staging:
      +database: TRADERS_DB
      +schema: STAGING
      +materialized: table

    data_vault:

      hubs:
        +database: TRADERS_DB
        +schema: HUB
        +materialized: table
        
      links:
        +database: TRADERS_DB
        +schema: LINK
        +materialized: table

      satellites:
        +database: TRADERS_DB
        +schema: SATELLITE
        +materialized: table
  
    dimensional_modelling:
        +database: TRADERS_DB
        +schema: DIM
        +materialized: incremental
        +incremental_strategy: merge
      
